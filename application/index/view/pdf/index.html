<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <title>Pdf</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            list-style: none;
        }
        .pdf{
            height: 740px;
            width: 950px;
            margin: 0 auto;
            background: url(/public/home/images/pdfBg.png) no-repeat;
            position: relative;
        }
        .name{
            padding: 242px 0 0 0;
            font-size: 50px;
            font-weight: bold;
            color: #5280ce;
            text-align: center;
            line-height: 100%;
        }
        .hours{
            font-size: 30px;
            font-weight: bold;
            color: #5280ce;
            position: absolute;
            top: 385px;
            left: 375px;
        }
        .userNum{
            font-size: 30px;
            font-weight: bold;
            color: #5280ce;
            position: absolute;
            top: 385px;
            left: 575px;
        }
        .date{
            font-size: 20px;
            color: #000;
            position: absolute;
            left: 250px;
            top: 515px;
        }
		.start,.end{
			font-size: 18px;
			color: #000;
			position: absolute;
			left: 445px;
			top: 428px;
		}
		.end{
			left: 620px;
		}
    </style>
</head>
<body>
<div class="pdf">
    <div class="name">{$name}</div>
    <div class="hours">{$class_num}</div>
    <div class="userNum">{$learner_num}</div>
    <div class="date">{$date}</div>
    <div class="start">{$start}</div>
    <div class="end">{$end}</div>
</div>
</body>
</html>
