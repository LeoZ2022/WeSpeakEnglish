<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1, user-scalable=no">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black">
		 
		<title>wespeakenglishChat</title>
	</head>
	<body>
	<div style="  padding: 15px 0 0 0; color: #666; font-size: 14px;">
		 {$xy|raw}
	</div>
	<style>
				body,html{
					padding: 0;
				}
				.policyText{
					max-width: 960px;
					font-size: 16px;
					color: #4e3d37;
					line-height: 30px;
					padding: 20px;
					margin: 0 auto;
				}
				.policyText p{
					padding: 0 0 20px 0;
					margin: 0;
					word-wrap:break-word; 
					line-height: 30px;
				}
				.policyText p:nth-child(1){
					padding-top: 0;
				}
				p.listStyle{
					position: relative;
					padding-left: 18px; 
					padding-bottom: 0;
				}
				.listStyle::after{
					width: 4px;
					height: 4px;
					border-radius: 100%;
					display: block;
					position: absolute;
					background: #4e3d37;
					content: '';
					left: 4px;
					top: 13px;
				}
				.title{
					text-align: center;
					margin: 0;
					padding: 40px 0 0 0;
				}
		</style>
		
	</body>
</html>
