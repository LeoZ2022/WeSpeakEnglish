<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"  content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,initial-scale=1.0">

    <link rel="stylesheet" href="__HOME_CSS__/layout.css">
    <link rel="stylesheet" href="__HOME_CSS__/widthdraw.css">
    <link rel="stylesheet" type="text/css" href="__HOME_CSS__/widthdraw_m.css" media="(max-width: 750px) "/>
{include file="public/header_js"}

<body class="usertype_{$user_type} partner{$is_partner|default=0}">
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MTCT69F"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<nav class="dif">
    <a class="backar pn" href="{:url('member/index')}"></a>
    {include file="public/nav_menu"}
</nav>

<div class="main">
    <dif class="ht"><b>Apply withdrawal</b> <a href="{:url('member/accounts')}">back</a></dif>
    <dif class="withdrawinput">
        <label >Balance</label> <b class="">$ {$user_info.moneys}</b>
    </dif>
    <form method="post" action="{:url('withdrawal')}" id="form_pass" onsubmit="return chk_pass()">
    <dif class="withdrawinput amount">
        <label >Withdrawal Amount(USD)</label> <input type="text" name="money" id="money" oninput="chkmoney(this.value)" placeholder="">
        <span class="msinfo">Please enter the amount you want to withdraw</span>
    </dif>
    <dif class="withdrawinput paypal">
        <label >To Paypal account</label> <input class="paypal_account" placeholder="Please enter account" name="paypal_account" id="paypal_account" type="text" value="{$user_info.paypal_account}" readonly>
        <button onclick="update_account()" type="button">Update</button><img src="__HOME_IMG__/pencil.png" alt="">
    </dif>
    <dif class="withdrawinput ">
        <label ></label> <input type="submit" value="withdraw" id="withdraw_btn" {empty name="user_info.paypal_account"} disabled{/empty} >
    </dif>
    </form>
</div>

{include file="public/footer"}
{include file="member/member_js"}
</body>
<script src="__HOME_JS__/easydropdown.js"></script>
<script>
    $(document).on('click', '.paypal>img', function () {
        $(this).hide();
        $(this).siblings("button").show();
        $(this).siblings("input").addClass("edit").removeAttr("readonly");
    });

    $(document).on('click', '.paypal>button', function () {
        $(this).siblings("input.edit").attr("readonly","readonly").removeClass("edit");
        $(this).hide()
        $(this).siblings("img").show();
    });

    var _user_money = {$user_info.moneys|default=0};
    function chkmoney(_money) {
        emptyacc(_money)
    }
    function emptyacc(_money){
        if ($("#paypal_account").val()==""){
            $('#withdraw_btn').prop('disabled', true);
        } else {
            if (_user_money < _money   ) {
                $('#withdraw_btn').prop('disabled', true);
            } else {
                $('#withdraw_btn').attr('disabled', false);
            }

        }
    }
    $(document).ready(function(){
        emptyacc(0)
    });

    easydropdown.all();
    function update_account() {
        var _account = $('#paypal_account').val();
        if (!_account) {
            $('#paypal_account').focus();
        }
        $.ajax({
            url: '/index/member/edit_account',
            data: {paypal_account: _account},
            type: 'post',
            dataType: 'json',
            success: function (res) {
                if (res.code == 200) {
                    $('#withdraw_btn').removeAttr('disabled');
                    $('#account').html(_account);
                } else {
                    showmsg(res.msg, res.code);
                }
            }
        })
        emptyacc();
    }

    function chk_pass(){
        if (!$('#money').val()) {
            $('#money').focus();
            return false;
        }
        showloading();
        $.ajax({
            data: $('#form_pass').serialize(),
            type: 'post',
            url: $('#form_pass').attr('action'),
            dataType: 'json',
            success: function (res) {
                showmsg(res.msg, res.code);
                if (res.code == 200) {
                    setTimeout("location.href='/index/member/accounts/act/withdrawal.html'", 2000);
                }
            }
        })
        return false;
    }
</script>
</html>
