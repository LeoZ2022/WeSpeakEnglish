<script>

    $(document).on('focus', '.logform dib input', function () {
        $(this).siblings("label").animate({bottom:"46px"},1);
    });

    $(document).on('blur', '.logform dib input', function () {
        if( $(this).val()=="" ){
            $(this).siblings("label").animate({bottom:"24px"},1);
        }
    });
</script>
