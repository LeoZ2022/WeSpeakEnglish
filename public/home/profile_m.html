<body>
<nav class="dif">
    <a href="###" class="backar"></a>
</nav>
<div class="wb myclass">
    <dif class="ht"><b>PROFILE</b></dif>
    <div class="profilebox">
        <div class="inputbox">
            <label>Email</label> <span>Estelle@gmail.com</span>
        </div>
        <div class="inputbox">
            <label>Nickname</label> <span>Estelle</span>
        </div>
        <div class="inputbox">
            <label>First language</label> <select name="" id="">
            <option value="">Chinese</option>
            <option value="">English</option>
            <option value="">Chinese</option>
            <option value="">English</option>
        </select>
        </div>
        <div class="inputbox">
            <label>Reside in</label> <select name="" id="">
            <option value="">The United States(UTC-04:00)</option>
            <option value="">The United States(UTC-04:00)</option>
            <option value="">The United States(UTC-04:00)</option>
        </select>
        </div>
        <div class="inputbox">
            <label>Years of learning English</label> <input type="text" value="Smooth communication, Write beautiful mail">
        </div>
        <div class="inputbox">
            <label>Goals of speaking English</label> <input type="text" value="10 year">
        </div>
        <div class="inputbox">
            <label>English proficiency level</label>
            <dib>
                <input name="level" value="Beginner" id="Beginner" type="radio">
                <label value="Beginner" for="Beginner">Beginner</label>
                <input name="level" checked value="Intermidate" id="Intermidate" type="radio">
                <label value="Intermidate" for="Intermidate">Intermidate</label>
                <input name="level" value="Proficient" id="Proficient" type="radio">
                <label value="Proficient" for="Proficient">Proficient</label></dib>
        </div>
        <div class="inputbox">
            <label class="top">Self introduction</label> <textarea>
        I come from China and I hope to improve my
        English. I like reading, watching dramas and
        outdoors.
    </textarea>
        </div>
        <div class="submit"><input type="submit" value="Update"></div>
    </div>
</div>
