<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1, user-scalable=no">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black">
		 
		<title>wespeakenglishChat</title>
		<style>
		*{
			padding: 0;
			margin: 0;
			
		}
		body,html{
			height: 100%;
		}
		.main{
			height: 100%;
			max-width: 750px;
			margin: 0 auto;
			/* background:url('__HOME_IMG__/d_bg.png') no-repeat center bottom; */
			background:url('https://www.wespeakenglish.chat/public/home/style/img/d_bg.png') no-repeat center bottom;
			background-size: 100% 100%;
		}
		.d_logo{
			max-width: 251px;
			margin: 0 auto;
			padding: 30px 0 0 0;
			position: relative;
			z-index: 99999;
		}
		img{
			max-width: 100%;
		}
		.d_btn{
			display: block;
			max-width: 180px;
			margin: 0 auto;
			padding: 20px 0 0 0;
			position: relative;
			z-index: 99999;
		}
		.d_pic{
			position: absolute;
			left: 18px;
			right: 18px;
			bottom: 1%;
			text-align:center;
			z-index: 1;
		}
		</style>
	</head>
	<body>
		<div class="main">
			<!-- __HOME_IMG__/d_logo -->
			
			<div class="d_logo"><img src="https://www.wespeakenglish.chat/public/home/style/img/d_logo.png" /></div>
			<a href="https://itunes.apple.com/cn/app/id1564368120?mt=8" class="d_btn"><img src="https://www.wespeakenglish.chat/public/home/style/img/d_btn.png" /></a>
			<!-- <a href="{$app_cfg.apk}" class="d_btn"><img src="__HOME_IMG__/d_btn.png" /></a> -->
			<div class="d_pic"><img src="https://www.wespeakenglish.chat/public/home/style/img/d_pic.png" /></div>
		</div>
		
	</body>
</html>
